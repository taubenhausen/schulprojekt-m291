<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mario Game</title>
    <style>
      #score {
        text-align: center;
      }
 
      #game {
        width: 600px;
        height: 300px;
        border: 2px solid black;
        margin: auto;
        background-image: url("https://raw.githubusercontent.com/kriscfoster/chrome-dino-game/master/background.jpg");
        background-size: cover;
      }
 
      #mario {
        height: 100px;
        width: 80px;
        top: 200px;
        position: relative;
        background-image: url("https://github.com/taubenhausen/schulprojekt-m291/blob/dino-aufgabe-1/mario-49314.png?raw=true");
        background-size: cover;
      }
 
      #monster {
        width: 70px;
        height: 100px;
        position: relative;
        top: 100px;
        left: 550px;
        background-image: url("https://github.com/taubenhausen/schulprojekt-m291/blob/dino-aufgabe-1/toppng.com-iranha-plant-mario-kart-mario-bros-super-mario-venus-fly-tra-714x1029.png?raw=true");
        background-size: cover;
        animation: monster 2s infinite;
        animation-play-state: running;
      }
 
      @keyframes monster {
        0%   { left: 550px; }
        100% { left: -50px; }
      }
 
      .jump-animation {
        animation: jump 1.5s;
      }
 
      @keyframes jump {
        0%   { top: 225px; }
        30%  { top: 75px; }
        70%  { top: 75px; }
        100% { top: 225px; }
      }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="mario"></div>
      <div id="monster"></div>
    </div>
    <h1 id="score">0</h1>
 
    <script>
      const mario = document.getElementById("mario")
      const monster = document.getElementById("monster")
      const score = document.getElementById("score")
 
      score.innerText = 0
      let gameOver = false
 
      function jump() {
        mario.classList.add("jump-animation")
        setTimeout(() => mario.classList.remove("jump-animation"), 1000)
      }
 
      document.addEventListener("keypress", (event) => {
        if (!mario.classList.contains("jump-animation") && !gameOver) {
          jump()
        }
      })
 
      const gameLoop = setInterval(() => {
        const marioTop = parseInt(window.getComputedStyle(mario).getPropertyValue("top"))
        const monsterLeft = parseInt(window.getComputedStyle(monster).getPropertyValue("left"))
 
        score.innerText = parseInt(score.innerText) + 2
 
        if (monsterLeft < 0) {
          monster.style.display = "none"
        } else {
          monster.style.display = ""
        }
 
        if (monsterLeft < 20 && monsterLeft > 0 && marioTop > 150) {
          gameOver = true
          clearInterval(gameLoop)
          alert("Kollision! Du musst das Spiel von vorne anfangen. Seite neu laden zum Neustart.")
        }
      }, 50)
    </script>
  </body>
</html>

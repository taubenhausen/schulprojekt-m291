<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mario Game</title>
    <style>
      #score {
        text-align: center;
      }
 
      #game {
        width: 600px;
        height: 300px;
        border: 2px solid black;
        margin: auto;
        background-image: url("https://raw.githubusercontent.com/kriscfoster/chrome-dino-game/master/background.jpg");
        background-size: cover;
      }
 
      #mario {
        height: 100px;
        width: 80px;
        top: 200px;
        position: relative;
        background-image: url("https://github.com/taubenhausen/schulprojekt-m291/blob/dino-aufgabe-1/mario-49314.png?raw=true");
        background-size: cover;
      }
 
      #monster {
        width: 50px;
        height: 50px;
        position: relative;
        top: 175px;
        left: 550px;
        background-image: url("https://github.com/taubenhausen/schulprojekt-m291/blob/dino-aufgabe-1/toppng.com-iranha-plant-mario-kart-mario-bros-super-mario-venus-fly-tra-714x1029.png?raw=true");
        background-size: cover;
        /* Animation ist am Anfang gestoppt */
        animation: monster 2s infinite;
        animation-play-state: paused;
      }
 
      @keyframes monster {
        0%   { left: 550px; }
        100% { left: -50px; }
      }
 
      .jump-animation {
        animation: jump 1s cubic-bezier(0.33, 0, 0.66, 1);
      }}
 
      @keyframes jump {
        0%   { top: 200px; animation-timing-function: ease-out; } /* schnell nach oben */
        40%  { top: 60px;  animation-timing-function: ease-in; }  /* kurz oben bleiben */
        100% { top: 200px; }                                       /* langsam fallen, dann schneller */
      }
 
      /* Start Button Styling */
      #startButton {
        display: block;
        margin: 16px auto;
        padding: 10px 32px;
        font-size: 18px;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
      }
 
      #startButton:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="mario"></div>
      <div id="monster"></div>
    </div>
    <h1 id="score">0</h1>
 
    <!-- Start Button im HTML -->
    <button id="startButton">Start</button>
 
    <script>
      const mario = document.getElementById("mario")
      const monster = document.getElementById("monster")
      const score = document.getElementById("score")
      const startButton = document.getElementById("startButton") // Variable für Start Button
 
      score.innerText = 0
      let gameOver = false
      let gameStarted = false // Spiel ist anfangs gestoppt
      let gameLoop = null
 
      function jump() {
        mario.classList.add("jump-animation")
        setTimeout(() => mario.classList.remove("jump-animation"), 1000)
      }
 
      document.addEventListener("keypress", (event) => {
        if (!mario.classList.contains("jump-animation") && !gameOver && gameStarted) {
          jump()
        }
      })
 
      // Funktion die das Spiel startet
      function startGame() {
        console.log("Start Button wurde geklickt – Spiel startet!") // console.log Meldung
 
        gameStarted = true
        startButton.style.display = "none" // Button verstecken nach Klick
 
        // Monster-Animation starten
        monster.style.animationPlayState = "running"
 
        // Game Loop starten
        gameLoop = setInterval(() => {
          const marioTop = parseInt(window.getComputedStyle(mario).getPropertyValue("top"))
          const monsterLeft = parseInt(window.getComputedStyle(monster).getPropertyValue("left"))
 
          score.innerText = parseInt(score.innerText) + 2
 
          if (monsterLeft < 0) {
            monster.style.display = "none"
          } else {
            monster.style.display = ""
          }
 
          if (monsterLeft < 20 && monsterLeft > 0 && marioTop > 150) {
            gameOver = true
            clearInterval(gameLoop)
            alert("Kollision! Du musst das Spiel von vorne anfangen. Seite neu laden zum Neustart.")
          }
        }, 50)
      }
 
      // Click Event Handler für Start Button
      startButton.addEventListener("click", () => {
        startGame()
      })
    </script>
  </body>
</html>
